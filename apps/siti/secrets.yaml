apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: infisical
spec:
  provider:
    infisical:
      hostAPI: http://172.17.0.1:8090
      auth:
        universalAuthCredentials:
          clientId: { name: infisical-auth, key: clientId }
          clientSecret: { name: infisical-auth, key: clientSecret }
      secretsScope:
        projectSlug: siti-ub-4-y
        environmentSlug: prod
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: siti-env
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: SecretStore, name: infisical }
  target:
    name: siti-env
  dataFrom:
    - find:
        name: { regexp: ".*" }
