apiVersion: apps/v1
kind: Deployment
metadata:
  name: siti
  annotations:
    secret.reloader.stakater.com/reload: "siti-env"   # restart when Infisical values change
spec:
  replicas: 1
  # Telegram allows one long-polling client per token. A rolling update would run two
  # pods at once and both get 409 Conflict, so stop the old pod first. This also makes
  # Reloader restarts safe.
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: siti }
  template:
    metadata:
      labels: { app: siti }
    spec:
      containers:
        - name: siti
          image: ghcr.io/devoverid/siti:1.1.1
          envFrom:
            - secretRef: { name: siti-env }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 512Mi }
