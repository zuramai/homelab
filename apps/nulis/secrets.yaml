apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: infisical
spec:
  provider:
    infisical:
      hostAPI: http://172.17.0.1:8090        # Infisical on the docker0 bridge (10.1)
      auth:
        universalAuthCredentials:
          clientId: { name: infisical-auth, key: clientId }
          clientSecret: { name: infisical-auth, key: clientSecret }
      secretsScope:
        projectSlug: nulis                   # from the project's settings
        environmentSlug: prod
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nulis-secrets
spec:
  refreshInterval: 1m
  secretStoreRef: { kind: SecretStore, name: infisical }
  target:
    name: nulis-secrets                      # the Secret app.yaml reads
  dataFrom:
    - find:
        name: { regexp: ".*" }               # every variable in the environment
