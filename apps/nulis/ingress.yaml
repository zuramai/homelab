apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nulis
spec:
  ingressClassName: traefik
  rules:
    - host: nulis.saugi.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nulis
                port: { number: 3000 }
