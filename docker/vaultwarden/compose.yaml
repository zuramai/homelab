services:
      vaultwarden:
        image: vaultwarden/server:latest
        container_name: vaultwarden
        restart: unless-stopped
        environment:
          DOMAIN: "https://homelab.starling-tilapia.ts.net:9444"
          SIGNUPS_ALLOWED: "true"   
        volumes:
          - ./data:/data
        ports:
          - "127.0.0.1:8080:80"
