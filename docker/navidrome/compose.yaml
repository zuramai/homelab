services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    restart: unless-stopped
    environment:
      ND_SCANSCHEDULE: "1h"
    volumes:
      - ./data:/data
      - /home/zuramai/Music:/music:ro
    ports:
      - "127.0.0.1:4533:4533"
    networks: [tunnel]
networks:
  tunnel:
    external: true
