# Argo CD read access to the private homelab repo.
# Copy to secrets/argocd-repo-secret.yaml (gitignored), fill in a fine-grained
# PAT with read-only Contents access to zuramai/homelab, then:
#   scripts/k8s.sh bootstrap
apiVersion: v1
kind: Secret
metadata:
  name: homelab-repo
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: https://github.com/zuramai/homelab.git
  username: zuramai
  password: <PAT>