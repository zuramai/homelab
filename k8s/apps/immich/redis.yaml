# Redis/valkey holds queues and caches only; upstream compose gives it no
# volume either. Persistence is off so it does not thrash the container layer.
apiVersion: v1
kind: Service
metadata:
  name: immich-redis
spec:
  selector: { app: immich-redis }
  ports: [{ port: 6379, targetPort: redis }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-redis
spec:
  replicas: 1
  selector:
    matchLabels: { app: immich-redis }
  template:
    metadata:
      labels: { app: immich-redis }
    spec:
      containers:
        - name: redis
          # Digest pinned from the Immich v3.4.2 release compose file.
          image: docker.io/valkey/valkey:9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
          args: ["valkey-server", "--save", "", "--appendonly", "no"]
          ports: [{ name: redis, containerPort: 6379 }]
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 512Mi }
