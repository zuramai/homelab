apiVersion: v1
kind: Service
metadata:
  name: immich-ml
spec:
  selector: { app: immich-ml }
  ports: [{ port: 3003, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-ml
spec:
  replicas: 1
  selector:
    matchLabels: { app: immich-ml }
  template:
    metadata:
      labels: { app: immich-ml }
    spec:
      containers:
        - name: machine-learning
          image: ghcr.io/immich-app/immich-machine-learning:v3.4.2
          env:
            - { name: TZ, value: Asia/Jakarta }
            - { name: MACHINE_LEARNING_MODEL_REVISION, value: v2 }
            - { name: MACHINE_LEARNING_CACHE_FOLDER, value: /cache }
          ports: [{ name: http, containerPort: 3003 }]
          volumeMounts:
            - { name: cache, mountPath: /cache }
          # Models load lazily on the first request; the probe only proves the
          # HTTP worker is up.
          readinessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 200m, memory: 1Gi }
            limits: { memory: 6Gi }
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: immich-ml-cache
