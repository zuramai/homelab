# Tailnet-only: https://immich.starling-tilapia.ts.net, certificate issued by
# the Tailscale operator (the tailnet has HTTPS enabled). No public Cloudflare
# hostname — Immich holds a personal photo library.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immich
spec:
  ingressClassName: tailscale
  tls:
    - hosts: [immich]
  rules:
    - host: immich
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: immich
                port: { number: 2283 }
