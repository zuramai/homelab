# Tailnet-only: https://cloud.starling-tilapia.ts.net. Clerk/IDP redirects use
# OC_URL, so the hostname here must match that env var exactly.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opencloud
spec:
  ingressClassName: tailscale
  tls:
    - hosts: [cloud]
  rules:
    - host: cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opencloud
                port: { number: 9200 }
